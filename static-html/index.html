<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - St. George Hospital</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="login-container">
        <div class="login-box">
            <h1 class="login-title">St. George Hospital</h1>
            <p class="login-subtitle">Hospital Management System</p>

            <div class="tabs">
                <button class="tab active">Login</button>
                <button class="tab">Patient Signup</button>
            </div>

            <h2 style="font-size: 18px; font-weight: 600; margin-bottom: 4px;">Welcome Back</h2>
            <p class="text-sm text-gray mb-4">Sign in to access the portal.</p>

            <form action="dashboard.html" method="get">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-input" placeholder="name@example.com"
                        value="admin@stgeorgehospital.org">
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" placeholder="Enter password" value="123">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    Sign In
                </button>
            </form>

            <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid #e5e7eb; text-align: center;">
                <p class="text-sm text-gray">Hospital Management System v1.0</p>
            </div>

            <div class="alert alert-info mt-4">
                <div>
                    <p class="text-sm"><strong>Demo Credentials:</strong></p>
                    <p class="text-sm">Email: admin@stgeorgehospital.org</p>
                    <p class="text-sm">Password: 123</p>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
